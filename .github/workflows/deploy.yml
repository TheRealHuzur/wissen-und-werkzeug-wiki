name: Deploy Wiki

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Zwei Deploys, die sich zeitlich ueberschneiden, koennen sich gegenseitig
# zerlegen: Der eine loescht, was der andere gerade hochlaedt. Seit
# --delete scharf ist, ist das nicht mehr folgenlos.
#
# cancel-in-progress steht ausgeschrieben auf false, obwohl das der
# Vorgabewert ist, weil hier die eigentliche Entscheidung liegt. Mit true
# wuerde ein laufender Deploy abgebrochen, sobald ein neuer startet. mirror
# entfernt ohne --overwrite jede zu ersetzende Datei vor dem Neuhochladen;
# ein Abbruch mitten im Spiegeln liesse geloeschte Dateien ohne Ersatz
# zurueck. Mit false wartet der zweite Lauf, bis der erste fertig ist.
#
# Der Gruppenname ist fest und in beiden Workflows derselbe, damit
# Trockenlauf und echter Deploy in dieselbe Warteschlange laufen. Beide
# sprechen denselben Server an. Mit ${{ github.workflow }} bekaeme jeder
# Workflow eine eigene Gruppe, und genau diese Ueberschneidung bliebe
# moeglich.
concurrency:
  group: deploy-wiki
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Install lftp
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: Deploy via lftp (SFTP protocol)
        env:
          SFTP_USERNAME: ${{ secrets.SFTP_USERNAME }}
          SFTP_SERVER: ${{ secrets.SFTP_SERVER }}
          # Der Variablenname LFTP_PASSWORD ist von lftp vorgegeben:
          # --env-password liest das Passwort aus genau dieser Variablen.
          # Das Secret behaelt seinen Namen SFTP_PASSWORD.
          LFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
        run: |
          set -euo pipefail
          # Die Zugangsdaten gehen nicht mehr ueber die Kommandozeile:
          # In der Prozessliste des Runners stand bisher das Passwort im
          # Klartext. Das Passwort erreicht lftp jetzt nur ueber die
          # Umgebung, der Benutzername ueber eine Skriptdatei mit 0600,
          # die nach dem Lauf in jedem Fall wieder verschwindet.
          LFTP_SCRIPT="$(mktemp)"
          trap 'rm -f "$LFTP_SCRIPT"' EXIT
          chmod 600 "$LFTP_SCRIPT"
          # cmd:fail-exit sorgt dafuer, dass lftp beim ersten
          # fehlgeschlagenen Befehl aussteigt, statt die folgenden noch
          # abzuarbeiten. Ohne diese Einstellung uebernimmt das
          # abschliessende "quit" den Status des *letzten* Befehls -- ein
          # frueherer Fehlschlag wird dadurch von jedem spaeteren Erfolg
          # verdeckt und der Lauf endet gruen. Bei einem Ablauf, der ab
          # jetzt loescht, darf das nicht passieren.
          #
          # "open" verbindet sich nicht sofort, sondern merkt sich nur die
          # Sitzung; ein unerreichbarer Server faellt deshalb erst beim
          # mirror auf. Mit fail-exit bricht lftp dann dort ab, statt
          # weiterzulaufen.
          #
          # --delete macht den Serverinhalt zur genauen Kopie von dist/.
          # Freigegeben durch den Trockenlauf vom 31.08.2026: Der Zielpfad
          # trifft das Wiki-Verzeichnis, nicht die Webspace-Wurzel, und die
          # Loeschliste umfasst 699 Dateien und 14 Verzeichnisse, alle
          # verwaist. Wer --delete wieder entfernen will, sollte vorher den
          # Workflow "Deploy Trockenlauf" starten; der zeigt ohne Risiko,
          # was ein Lauf tun wuerde.
          #
          # --verbose ist hier keine Kosmetik: Ohne es gibt mirror bei
          # einem erfolgreichen Lauf ueberhaupt keine Zeile aus. Das
          # Entfernen von 699 Dateien wuerde im Actions-Protokoll dann
          # keine Spur hinterlassen. Mit --verbose steht je Vorgang eine
          # Zeile da -- rund 1500 fuer diesen Bestand, ohne messbaren
          # Zeitverlust.
          cat > "$LFTP_SCRIPT" <<EOF
          set sftp:auto-confirm yes;
          set cmd:fail-exit yes;
          open -u "$SFTP_USERNAME" --env-password sftp://$SFTP_SERVER;
          mirror -R --delete --verbose ./dist/ /;
          quit;
          EOF
          lftp -f "$LFTP_SCRIPT"
