name: Deploy Wiki

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Install lftp
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: Deploy via lftp (SFTP protocol)
        env:
          SFTP_USERNAME: ${{ secrets.SFTP_USERNAME }}
          SFTP_SERVER: ${{ secrets.SFTP_SERVER }}
          # Der Variablenname LFTP_PASSWORD ist von lftp vorgegeben:
          # --env-password liest das Passwort aus genau dieser Variablen.
          # Das Secret behaelt seinen Namen SFTP_PASSWORD.
          LFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
        run: |
          set -euo pipefail
          # Die Zugangsdaten gehen nicht mehr ueber die Kommandozeile:
          # In der Prozessliste des Runners stand bisher das Passwort im
          # Klartext. Das Passwort erreicht lftp jetzt nur ueber die
          # Umgebung, der Benutzername ueber eine Skriptdatei mit 0600,
          # die nach dem Lauf in jedem Fall wieder verschwindet.
          LFTP_SCRIPT="$(mktemp)"
          trap 'rm -f "$LFTP_SCRIPT"' EXIT
          chmod 600 "$LFTP_SCRIPT"
          cat > "$LFTP_SCRIPT" <<EOF
          set sftp:auto-confirm yes;
          open -u "$SFTP_USERNAME" --env-password sftp://$SFTP_SERVER;
          mirror -R ./dist/ /;
          quit;
          EOF
          lftp -f "$LFTP_SCRIPT"
